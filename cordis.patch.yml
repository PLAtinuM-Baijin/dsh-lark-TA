# dsh-lark-TA bundle：C++ 课程 AI 助教的 channel 插件 + 记忆整理插件 + 控制面板 + 三个 agent preset。
# 与个人版 feishu-channel 完全独立：独立飞书应用、独立工作区、独立记忆目录。

- insert:
    # 常驻 channel：连接、按 chat 路由、触发 agent 回合，都在这个插件里。
    - id: feishu-channel
      name: '@local/dsh-lark-ta'
      config:
        # 密钥不要写进 YAML：Loader 在激活时对这段表达式求值。
        appId: !!js process.env.TA_APP_ID
        appSecret: !!js process.env.TA_APP_SECRET
        cwd: !!js process.env.TA_WORKSPACE
        # 普通会话（课程群、学生私聊）与助教/老师小群用不同的 preset；
        # 小群的 preset 多了飞书 MCP，学生侧拿不到文档/日历工具。
        agentPreset: feishu-ta
        managerPreset: feishu-ta-manager
        managerChatIds: !!js (process.env.TA_MANAGER_CHAT_IDS || '').split(',')
        replyTimeoutMs: 600000
        maxTurnMs: 1800000
        cardStreaming: !!js (process.env.TA_CARD_STREAMING || 'true') !== 'false'
        # 定时任务与本地历史的落盘位置；空字符串时用 ~/.dsh-lark-ta-* 默认值。
        scheduleFile: !!js (process.env.TA_SCHEDULE_FILE || '')
        historyDir: !!js (process.env.TA_HISTORY_DIR || '')
        # 入站附件归档目录；部署时应放在工作区内（如 $TA_WORKSPACE/files）。
        attachmentsDir: !!js (process.env.TA_FILES_DIR || '')
        requireMentionInGroup: true
        # 每个私聊 chat 每天最多处理多少条提问；0 = 不限。用量记录落盘后跨重启有效。
        dmDailyLimit: !!js Number(process.env.TA_DM_DAILY_LIMIT || 30)
        dmLimitFile: !!js (process.env.TA_DM_LIMIT_FILE || '')
        # 群聊只回应登记的群（班级群、助教/老师小群）；私聊不校验 open_id，
        # 飞书开发者后台的应用可用范围就是准入边界。
        allowedChatIds: !!js (process.env.TA_GROUP_CHAT_IDS || '').split(',')
        sessionPrefix: feishu-
        timeZone: Asia/Shanghai
        logLevel: info

    # 每晚的顶层记忆整理：只读登记群聊的本地聊天历史 → feishu-root 用 feishu_memory 整理。
    - id: feishu-memory-curator
      name: '@local/dsh-lark-ta/memory-curator'
      config:
        memoryDir: !!js (process.env.TA_MEMORY_DIR || '')
        historyDir: !!js (process.env.TA_HISTORY_DIR || '')
        # 参与整理的群：班级大群 + 助教/老师小群；学生私聊不参与。
        curatorChatIds: !!js (process.env.TA_CURATOR_CHAT_IDS || '').split(',')
        # 其中属于公开群（班级大群）的 chat_id；其余按内部群处理。
        publicChatIds: !!js (process.env.TA_PUBLIC_CHAT_IDS || '').split(',')
        curatorTime: !!js (process.env.TA_CURATOR_TIME || '03:17')

    # 控制面板：Host JSON 路由 + 浏览器 bundle。单独的包（ui/package.json），
    # 因为 channel 包里已有 Loader 条目指向同一 package.json，不能再声明 dsh.client。
    - id: ta-panel
      name: /opt/dsh-lark-TA/ui/index.js
      config:
        ns: feishu-channel
        routeBase: /ta-panel

    # 普通会话 preset：无 shell、无原生文件工具、无后台任务、无子代理、无 MCP。
    - id: preset-feishu-ta
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: feishu-ta
        name: C++ 课程 AI 助教
        description: 群聊/私聊答疑：可读课程目录、只写工作区、可发工作区文件；无 shell、无飞书 MCP。
        order: 20
        plugins:
          # 从 TA_WORKSPACE/TA.md 与 流程安排.md 加载助教守则与工作流程。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              instructionFileCandidates:
                - TA.md
                - 流程安排.md
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 C++ 课程群的 AI 助教。默认用中文，先给结论，再给理由。
                面向学生答疑要讲清楚“为什么”，代码要能直接跑；不确定的课程安排不要编造，去查工作区里的课程资料。
                飞书消息按 Markdown 渲染（CommonMark + GFM），可用标题、列表、表格和代码块，但要克制。
                语言风格：清晰、简短、信息到位。先一句话结论；不寒暄、不复述问题、不总结自己刚做过的事；群聊回复一般不超过 5 行，只有贴代码或完整讲解时例外。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # 每次请求前注入：全局记忆 + 本 chat 的记忆（只读）。
          - id: memory-context
            name: '@local/dsh-lark-ta/memory-context'
            config:
              memoryDir: !!js (process.env.TA_MEMORY_DIR || '')
          # 记忆读写工具；普通会话只能写本 chat，全局记忆只由整理会话写。
          - id: memory-tool
            name: '@local/dsh-lark-ta/memory-tool'
            config:
              memoryDir: !!js (process.env.TA_MEMORY_DIR || '')
          # 每轮注入最近聊天记录（含 message_id）；群文件带归档路径，被 @ 时可直接读。
          - id: history-context
            name: '@local/dsh-lark-ta/history-context'
            config:
              historyDir: !!js (process.env.TA_HISTORY_DIR || '')
              maxEntries: 12
              maxChars: 1600
              entryChars: 160
          # 模型选择发送方式：引用回复某条，或直接发一条新消息。
          - id: reply-tool
            name: '@local/dsh-lark-ta/reply-tool'
          # 把工作区里的文件/图片发到当前聊天。
          - id: send-file
            name: '@local/dsh-lark-ta/send-file'
            config:
              appId: !!js process.env.TA_APP_ID
              appSecret: !!js process.env.TA_APP_SECRET
              writeRoot: !!js process.env.TA_WORKSPACE
              cwd: !!js process.env.TA_WORKSPACE
          # 主动发一条新消息（不引用消息）；只有助教/老师小群可用。
          - id: send-text
            name: '@local/dsh-lark-ta/send-text'
            config:
              managerChatIds: !!js (process.env.TA_MANAGER_CHAT_IDS || '').split(',')
              allowedChatIds: !!js (process.env.TA_GROUP_CHAT_IDS || '').split(',')
          # 定时任务：到点唤醒聊天当天会话，回复作为新消息发出；只在助教/老师小群可用。
          - id: schedule-tool
            name: '@local/dsh-lark-ta/schedule-tool'
            config:
              managerChatIds: !!js (process.env.TA_MANAGER_CHAT_IDS || '').split(',')
              allowedChatIds: !!js (process.env.TA_GROUP_CHAT_IDS || '').split(',')
          # 受控文件工具：readRoots 只读课程目录，writeRoot 唯一可写工作区
          # （工作区同时可读；原生 dsh-tool-fs / tool-fs-search 故意不挂）。
          - id: ta-fs
            name: '@local/dsh-lark-ta/ta-fs'
            config:
              readRoots: !!js (process.env.TA_READ_DIRS || '').split(',')
              writeRoot: !!js process.env.TA_WORKSPACE
          # 受限命令（无 shell）：unzip/pdftotext/pdfinfo/file，只读课程目录与工作区。
          - id: doc-exec
            name: '@local/dsh-lark-ta/doc-exec'
            config:
              readRoots: !!js (process.env.TA_READ_DIRS || '').split(',')
              writeRoot: !!js process.env.TA_WORKSPACE
              cwd: !!js process.env.TA_FILES_DIR
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 联网搜索可用；通用 fetch 有内网 SSRF 风险，保持关闭。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
          # 洛谷题库：唯一的外网抓取出口，只访问 luogu.com.cn。
          - id: luogu
            name: '@local/dsh-lark-ta/luogu'
          # 按需把图片交给多模态模型直接看；PPTX/DOCX 内嵌图用 entry 指定，首次解包落盘复用。
          - id: view-image
            name: '@local/dsh-lark-ta/view-image'
            config:
              readRoots: !!js (process.env.TA_READ_DIRS || '').split(',')
              writeRoot: !!js process.env.TA_WORKSPACE
              cacheDir: !!js process.env.TA_FILES_DIR
          # web 模板把压缩后端禁用了，preset 自己挂一份，长会话才不会无限膨胀。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # 助教/老师小群 preset：与普通 preset 相同，额外挂飞书 MCP（文档/日历/任务/wiki/通讯录/读消息）。
    # 收消息和回复仍由 channel 负责，MCP 不开 WS、不发消息。
    - id: preset-feishu-ta-manager
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: feishu-ta-manager
        name: C++ 课程 AI 助教（助教小群）
        description: 助教/老师小群：在普通能力之外挂载飞书 MCP，可查文档、日历、任务与 wiki。
        order: 22
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              instructionFileCandidates:
                - TA.md
                - 流程安排.md
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 C++ 课程的 AI 助教，当前对话在助教/老师小群里。默认用中文，先给结论，再给理由。
                这里有老师与助教：可以讨论教学安排、审核中的题目与答案，但课程进度、未发布内容不要外传。
                飞书消息按 Markdown 渲染（CommonMark + GFM），可用标题、列表、表格和代码块，但要克制。
                语言风格：清晰、简短、信息到位。先一句话结论；不寒暄、不复述问题、不总结自己刚做过的事。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # 飞书 MCP：只挂在这一条 preset 上，学生私聊与课程群拿不到。
          - id: mcp-client-lark
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: stdio
              serverName: lark
              command: node
              args:
                - !!js (process.env.TA_LARK_MCP_DIR || '/opt/lark-mcp-dsh') + '/node_modules/tsx/dist/cli.mjs'
                - !!js (process.env.TA_LARK_MCP_DIR || '/opt/lark-mcp-dsh') + '/src/index.ts'
              env:
                LARK_APP_ID: !!js process.env.TA_APP_ID
                LARK_APP_SECRET: !!js process.env.TA_APP_SECRET
                LARK_TIMEZONE: Asia/Shanghai
                LARK_OWNER_OPEN_ID: !!js (process.env.TA_OWNER_OPEN_ID || '')
              cwd: !!js (process.env.TA_LARK_MCP_DIR || '/opt/lark-mcp-dsh')
              # OAuth 设备码流程会在工具调用里阻塞最多 10 分钟，留足余量。
              toolCallTimeoutMs: 660000
          - id: memory-context
            name: '@local/dsh-lark-ta/memory-context'
            config:
              memoryDir: !!js (process.env.TA_MEMORY_DIR || '')
          - id: memory-tool
            name: '@local/dsh-lark-ta/memory-tool'
            config:
              memoryDir: !!js (process.env.TA_MEMORY_DIR || '')
          - id: history-context
            name: '@local/dsh-lark-ta/history-context'
            config:
              historyDir: !!js (process.env.TA_HISTORY_DIR || '')
              maxEntries: 12
              maxChars: 1600
              entryChars: 160
          - id: reply-tool
            name: '@local/dsh-lark-ta/reply-tool'
          - id: send-file
            name: '@local/dsh-lark-ta/send-file'
            config:
              appId: !!js process.env.TA_APP_ID
              appSecret: !!js process.env.TA_APP_SECRET
              writeRoot: !!js process.env.TA_WORKSPACE
              cwd: !!js process.env.TA_WORKSPACE
          - id: send-text
            name: '@local/dsh-lark-ta/send-text'
            config:
              managerChatIds: !!js (process.env.TA_MANAGER_CHAT_IDS || '').split(',')
              allowedChatIds: !!js (process.env.TA_GROUP_CHAT_IDS || '').split(',')
          - id: schedule-tool
            name: '@local/dsh-lark-ta/schedule-tool'
            config:
              managerChatIds: !!js (process.env.TA_MANAGER_CHAT_IDS || '').split(',')
              allowedChatIds: !!js (process.env.TA_GROUP_CHAT_IDS || '').split(',')
          - id: ta-fs
            name: '@local/dsh-lark-ta/ta-fs'
            config:
              readRoots: !!js (process.env.TA_READ_DIRS || '').split(',')
              writeRoot: !!js process.env.TA_WORKSPACE
          - id: doc-exec
            name: '@local/dsh-lark-ta/doc-exec'
            config:
              readRoots: !!js (process.env.TA_READ_DIRS || '').split(',')
              writeRoot: !!js process.env.TA_WORKSPACE
              cwd: !!js process.env.TA_FILES_DIR
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
          - id: luogu
            name: '@local/dsh-lark-ta/luogu'
          - id: view-image
            name: '@local/dsh-lark-ta/view-image'
            config:
              readRoots: !!js (process.env.TA_READ_DIRS || '').split(',')
              writeRoot: !!js process.env.TA_WORKSPACE
              cacheDir: !!js process.env.TA_FILES_DIR
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # 顶层整理会话（feishu-root）专用：只注入全局记忆，可跨 chatId 操作；
    # 额外挂载知识库工具，维护工作区 kb/ 下的助教经验。
    - id: preset-feishu-curator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: feishu-curator
        name: 助教记忆整理员
        description: 整理记忆与经验知识库：无 shell、无通用文件工具、不对外发消息。
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 C++ 课程 AI 助教的记忆整理员。每次任务给你一批群聊记录，
                你只负责用 feishu_memory 维护长期记忆、用 feishu_kb 维护助教经验知识库，不做其他事。
                公开群的课程问答可进全局记忆；内部群的进度、审核的答案绝不进全局。
                知识库只收可复用的助教经验（配环境、工具链等），未发布的题目与答案不写入。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: memory-context
            name: '@local/dsh-lark-ta/memory-context'
            config:
              memoryDir: !!js (process.env.TA_MEMORY_DIR || '')
          - id: memory-tool
            name: '@local/dsh-lark-ta/memory-tool'
            config:
              memoryDir: !!js (process.env.TA_MEMORY_DIR || '')
          - id: kb-tool
            name: '@local/dsh-lark-ta/kb-tool'
            config:
              kbDir: !!js (process.env.TA_KB_DIR || '')
              curatorSessionId: feishu-root
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
